<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Column Threshold Running Percentage</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .controls { margin-bottom: 16px; }
    #plot { width: 100%; height: 650px; }
  </style>
</head>
<body>
  <h3>Running percentage of prior values above a threshold</h3>
  <div class="controls">
    <label for="columnSelect">Column:</label>
    <select id="columnSelect"></select>
    <label for="thresholdInput" style="margin-left: 12px;">Threshold:</label>
    <input id="thresholdInput" type="number" step="any" value="0" />
  </div>
  <div id="plot"></div>

  <script>
    let headers = [];
    let dataRows = [];
    let timestampIndex = -1;

    async function loadCSV() {
      const response = await fetch("record.csv");
      const text = await response.text();
      const rows = text.trim().split(/\r?\n/).filter(Boolean).map(r => r.split(","));
      headers = rows[0];
      dataRows = rows.slice(1);
      timestampIndex = headers.indexOf("timestamp");

      const numericColumns = headers.filter((h) => h !== "timestamp").filter((h) => {
        const index = headers.indexOf(h);
        return dataRows.every((row) => !Number.isNaN(Number(row[index])));
      });

      const select = document.getElementById("columnSelect");
      select.innerHTML = "";
      numericColumns.forEach((h) => {
        const opt = document.createElement("option");
        opt.value = h;
        opt.textContent = h;
        select.appendChild(opt);
      });

      select.value = numericColumns[0] || "";
      document.getElementById("thresholdInput").value = "0";

      select.addEventListener("change", updatePlot);
      document.getElementById("thresholdInput").addEventListener("input", updatePlot);

      updatePlot();
    }

    function updatePlot() {
      const select = document.getElementById("columnSelect");
      const thresholdInput = document.getElementById("thresholdInput");
      const column = select.value;
      const threshold = Number(thresholdInput.value);

      if (!column || timestampIndex < 0) return;

      const columnIndex = headers.indexOf(column);
      const timestamps = [];
      const percentages = [];

      let seenValues = 0;
      let trueCount = 0;

      dataRows.forEach((row) => {
        const timestamp = Number(row[timestampIndex]);
        const rawValue = row[columnIndex];
        const numericValue = Number(rawValue);
        const isAbove = Number.isFinite(numericValue) && numericValue > threshold;

        const pct = seenValues === 0 ? 0 : (trueCount / seenValues) * 100;
        timestamps.push(new Date(timestamp * 1000));
        percentages.push(pct);

        if (Number.isFinite(numericValue)) {
          seenValues += 1;
          if (isAbove) trueCount += 1;
        }
      });

      const trace = {
        x: timestamps,
        y: percentages,
        mode: "lines",
        name: `${column} > ${threshold}`,
        line: { color: "#d62728", width: 2 }
      };

      const layout = {
        title: `Running percentage of prior values where ${column} > ${threshold}`,
        xaxis: { title: "Time (ET)", type: "date" },
        yaxis: { title: "Percent of prior values (%)", range: [0, 100] },
        hovermode: "x"
      };

      Plotly.react("plot", [trace], layout, { responsive: true });
    }

    loadCSV().catch((err) => {
      document.getElementById("plot").innerHTML = "<p>Unable to load the CSV file.</p>";
      console.error(err);
    });
  </script>
</body>
</html>
