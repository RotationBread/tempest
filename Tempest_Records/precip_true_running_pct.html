<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precip True Running Percentage</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    #plot { width: 100%; height: 650px; }
  </style>
</head>
<body>
  <h3>Running percentage of prior minutes where precip_true is True</h3>
  <p>This chart shows, for each minute, the percentage of earlier minutes where <code>precip_true</code> was True.</p>
  <div id="plot"></div>

  <script>
    async function loadCSV() {
      const response = await fetch("record.csv");
      const text = await response.text();
      const rows = text.trim().split(/\r?\n/).filter(Boolean).map(r => r.split(","));
      const headers = rows[0];
      const dataRows = rows.slice(1);

      const timestampIndex = headers.indexOf("timestamp");
      const precipTrueIndex = headers.indexOf("precip_true");

      const timestamps = [];
      const percentages = [];

      let trueCount = 0;
      let priorCount = 0;

      dataRows.forEach((row) => {
        const timestamp = Number(row[timestampIndex]);
        const value = parseBoolean(row[precipTrueIndex]);

        const pct = priorCount === 0 ? 0 : (trueCount / priorCount) * 100;
        timestamps.push(new Date(timestamp * 1000));
        percentages.push(pct);

        priorCount += 1;
        if (value) {
          trueCount += 1;
        }
      });

      const trace = {
        x: timestamps,
        y: percentages,
        mode: "lines",
        name: "Running % of prior minutes",
        line: { color: "#1f77b4", width: 2 }
      };

      const layout = {
        title: "Running percentage of prior minutes with precip_true = True",
        xaxis: { title: "Time (ET)", type: "date" },
        yaxis: { title: "Percent of prior minutes (%)", range: [0, 100] },
        hovermode: "x"
      };

      Plotly.newPlot("plot", [trace], layout, { responsive: true });
    }

    function parseBoolean(value) {
      if (typeof value === "boolean") return value;
      const normalized = String(value).trim().toLowerCase();
      return normalized === "true" || normalized === "1" || normalized === "yes";
    }

    loadCSV().catch((err) => {
      document.getElementById("plot").innerHTML = "<p>Unable to load the CSV file.</p>";
      console.error(err);
    });
  </script>
</body>
</html>
