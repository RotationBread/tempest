<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSV Plot Viewer (DATE Format)</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <h3>Record Time Series Viewer</h3>

  <select id="columnSelect"></select>
  <div id="plot" style="width:100%;height:600px;"></div>

  <script>
    async function loadCSV() {
      const response = await fetch("normal_minute.csv");
      const text = await response.text();

      const rows = text.trim().split("\n").map(r => r.split(","));
      const headers = rows[0];
      const dataRows = rows.slice(1);

      const dateIndex = headers.indexOf("DATE");

      // ---- PRECOMPUTE ARRAYS ----
      const timestamps = new Array(dataRows.length);
      const columns = {};

      headers.forEach(h => columns[h] = new Array(dataRows.length));

      // helper to parse MMDDHHMM → Date
      function parseDate(str) {
        str = str.padStart(8, "0");

        const MM = parseInt(str.slice(0, 2)) - 1; // JS months 0-11
        const DD = parseInt(str.slice(2, 4));
        const HH = parseInt(str.slice(4, 6));
        const mm = parseInt(str.slice(6, 8));

        // use fixed year (change if needed)
        return new Date(2025, MM, DD, HH, mm);
      }

      for (let i = 0; i < dataRows.length; i++) {
        const row = dataRows[i];

        timestamps[i] = parseDate(row[dateIndex]);

        for (let j = 0; j < headers.length; j++) {
          const h = headers[j];
          columns[h][i] = row[j];
        }
      }

      // Convert numeric columns
      for (const h of headers) {
        if (h !== "DATE") {
          columns[h] = columns[h].map(v => Number(v));
        }
      }

      // ---- DROPDOWN ----
      const select = document.getElementById("columnSelect");

      headers.forEach(h => {
        if (h !== "DATE") {
          const opt = document.createElement("option");
          opt.value = h;
          opt.textContent = h;
          select.appendChild(opt);
        }
      });

      function plotColumn(col) {
        const trace = {
          x: timestamps,
          y: columns[col],
          mode: "lines",
          name: col
        };

        const layout = {
          title: col,
          xaxis: {
            title: "Time",
            type: "date"
          },
          yaxis: {
            title: col
          }
        };

        Plotly.react("plot", [trace], layout, { responsive: true });
      }

      select.addEventListener("change", () => {
        plotColumn(select.value);
      });

      // initial plot
      select.value = headers.find(h => h !== "DATE");
      plotColumn(select.value);
    }

    loadCSV();
  </script>
</body>
</html>
