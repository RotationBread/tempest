<!DOCTYPE html>
<html>
<head>
  <title>Polygon Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #121212;
      color: white;
    }
    textarea {
      width: 100%;
      height: 100px;
      background: #1e1e1e;
      color: white;
      border: 1px solid #444;
      padding: 10px;
    }
    button {
      margin: 10px 0;
      padding: 10px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
    #map {
      height: 500px;
    }
  </style>
</head>
<body>

<h2 style="padding:10px;">Polygon Input</h2>

<textarea id="input">
42107607 42347525 42477406 42467271 42317252 41887253
41797275 41667356 41527563 41547607 41677620 41977619
42107607
</textarea>

<div style="padding:10px;">
  <button onclick="drawPolygon()">Draw Polygon</button>
</div>

<div id="map"></div>

<script>
// Initialize map
const map = L.map('map').setView([42.1, -76.1], 10);

// Dark mode tiles (CartoDB Dark Matter)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap & CartoDB',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

let polygonLayer;

function parseCoords(raw) {
  const nums = raw.match(/\d+/g);

  return nums.map(n => {
    let lat = parseInt(n.slice(0, 4)) / 100;
    let lon = -parseInt(n.slice(4, 8)) / 100;
    return [lat, lon];
  });
}

function drawPolygon() {
  const raw = document.getElementById("input").value;
  const coords = parseCoords(raw);

  // Remove old polygon
  if (polygonLayer) {
    map.removeLayer(polygonLayer);
  }

  polygonLayer = L.polygon(coords, {
    color: 'cyan',
    weight: 2
  }).addTo(map);

  map.fitBounds(polygonLayer.getBounds());
}
</script>

</body>
</html>
