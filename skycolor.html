<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sky Color by Sun Altitude</title>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Arial;margin:18px;color:#032}
    .row{display:flex;gap:12px;align-items:center}
    .swatch{width:120px;height:80px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);border:1px solid rgba(0,0,0,.08)}
    input[type=range]{width:420px}
    table{border-collapse:collapse;margin-top:12px;width:100%}
    th,td{padding:6px 8px;border-bottom:1px solid #eee;font-family:monospace}
    .controls{margin-top:12px}
    button{padding:8px 12px;border-radius:6px;border:0;background:#0b76ff;color:#fff}
    .legend{display:flex;gap:8px;align-items:center;margin-top:12px}
  </style>
</head>
<body>
  <h2>Sky Color by Sun Altitude</h2>
  <p>Interactive clear-sky approximation of sky color vs sun altitude (degrees). Use the slider or enter a value. Click "Download CSV" to export colors at 0.1° steps from -30° to 73°.</p>

  <div class="row">
    <label for="alt">Sun altitude: </label>
    <input id="alt" type="range" min="-30" max="73" step="0.1" value="10">
    <input id="altNum" type="number" min="-30" max="73" step="0.1" value="10" style="width:90px;margin-left:8px">
    <div class="swatch" id="swatch"></div>
    <div style="min-width:180px">
      <div><strong id="hex">#87CEEB</strong></div>
      <div id="rgb" style="font-family:monospace;color:#444">rgb(135,206,235)</div>
    </div>
  </div>

  <div class="controls">
    <button id="download">Download CSV (−30° → 73°, step 0.1°)</button>
    <button id="showGradient">Show Full Gradient</button>
  </div>

  <div id="gradientContainer" style="margin-top:12px"></div>

  <table id="sampleTable" aria-label="sample colors">
    <thead><tr><th>Altitude°</th><th>HEX</th><th>RGB</th><th>Preview</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    // Clear-sky approximation using smooth, physically-inspired blends.
    function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
    function lerp(a,b,t){return a + (b-a)*t}
    function lerpColor(c1,c2,t){return [Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))]}
    function toHex([r,g,b]){function h(n){return n.toString(16).padStart(2,'0')}return '#'+h(clamp(Math.round(r),0,255))+h(clamp(Math.round(g),0,255))+h(clamp(Math.round(b),0,255))}

    // Anchors for different sun altitude regimes (clear atmosphere, low turbidity)
    const anchors = [
      {a:-30, c:[4,8,32]},      // deep night
      {a:-12, c:[12,20,48]},    // nautical twilight
      {a:-6, c:[58,12,48]},     // deep twilight purple
      {a:-2, c:[255,80,30]},    // vivid sunset
      {a:0, c:[255,160,60]},    // sunrise/sunset rim
      {a:5, c:[255,200,120]},   // warm morning
      {a:10, c:[255,240,200]},  // pale yellow overhead
      {a:20, c:[170,210,255]},  // light blue
      {a:30, c:[135,206,235]},  // skyblue
      {a:50, c:[110,192,255]},  // deep day
      {a:73, c:[160,223,255]}   // high sun, washed blue
    ];

    // Helpers: RGB <-> HSV
    function rgbToHsv(r,g,b){ r/=255; g/=255; b/=255; const max=Math.max(r,g,b), min=Math.min(r,g,b); const d=max-min; let h=0; if(d!==0){ if(max===r) h=(g-b)/d + (g<b?6:0); else if(max===g) h=(b-r)/d + 2; else h=(r-g)/d +4; h/=6; } const s = max===0?0:d/max; const v = max; return [h, s, v]; }
    function hsvToRgb(h,s,v){ const i = Math.floor(h*6); const f = h*6 - i; const p = v*(1-s); const q = v*(1-f*s); const t = v*(1-(1-f)*s); let r,g,b; switch(i%6){case 0: r=v; g=t; b=p; break; case 1: r=q; g=v; b=p; break; case 2: r=p; g=v; b=t; break; case 3: r=p; g=q; b=v; break; case 4: r=t; g=p; b=v; break; case 5: r=v; g=p; b=q; break;} return [Math.round(r*255), Math.round(g*255), Math.round(b*255)]; }

    function computeColor(alt){
      alt = clamp(alt, -30, 73);
      // Interpolate base RGB from anchors
      let base = anchors[anchors.length-1].c;
      for(let i=0;i<anchors.length-1;i++){
        const a1 = anchors[i], a2 = anchors[i+1];
        if(alt>=a1.a && alt<=a2.a){
          const t = (alt - a1.a)/(a2.a - a1.a);
          base = lerpColor(a1.c, a2.c, t);
          break;
        }
      }

      // Convert to HSV to apply perceptual shifts
      let [h,s,v] = rgbToHsv(base[0], base[1], base[2]);

      // Geometry / optical proxies
      const altRad = alt * Math.PI/180;
      const sinAlt = clamp(Math.sin(altRad), -1, 1);
      const altNorm = (alt + 30) / (73 + 30); // 0..1

      // Blue attenuation due to longer path through atmosphere near horizon
      const blueAtten = Math.exp(-3.2 * (1 - Math.max(0, sinAlt)));
      // Red/orange boost from increased scattering of shorter wavelengths
      const redBoost = 1 + 1.4 * (1 - Math.max(0, sinAlt));

      // Increase saturation for dramatic sunsets, decrease for high sun
      s *= lerp(1.25, 0.95, altNorm);
      s = clamp(s * (1 + 0.7*(1 - Math.max(0, sinAlt))), 0, 1);

      // Shift hue toward warm orange when sun is near horizon
      const warmHue = 0.06; // ~21° (orange)
      const hueShiftFactor = clamp(0.9 * (1 - Math.max(0, sinAlt)), 0, 1);
      h = (h * (1 - hueShiftFactor) + warmHue * hueShiftFactor) % 1;

      // Darken sky for low sun / twilight
      v *= lerp(0.25, 1.0, altNorm);

      // Convert back and apply spectral channel scaling
      let rgb = hsvToRgb(h, clamp(s,0,1), clamp(v,0,1));
      rgb[2] = clamp(rgb[2] * blueAtten, 0, 255);
      rgb[0] = clamp(rgb[0] * redBoost, 0, 255);
      rgb[1] = clamp(rgb[1] * (1 + 0.25*(1 - Math.max(0, sinAlt))), 0, 255);

      // For deep twilight (alt << 0) introduce purplish rim
      if(alt < -6){
        const t = clamp(( -6 - alt)/24, 0, 1);
        // mix toward a twilight purple
        const purple = [88, 12, 64];
        rgb = lerpColor(rgb, purple, t*0.85);
      }

      return rgb;
    }

    // UI wiring
    const altRange = document.getElementById('alt');
    const altNum = document.getElementById('altNum');
    const swatch = document.getElementById('swatch');
    const hexLabel = document.getElementById('hex');
    const rgbLabel = document.getElementById('rgb');

    function updateUI(){
      const alt = parseFloat(altNum.value);
      const rgb = computeColor(alt);
      const hex = toHex(rgb);
      swatch.style.background = hex;
      hexLabel.textContent = hex;
      rgbLabel.textContent = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
      altRange.value = alt;
      renderSampleTable(alt);
    }

    altRange.addEventListener('input', e=>{altNum.value = e.target.value; updateUI()});
    altNum.addEventListener('change', e=>{ altRange.value = e.target.value; updateUI()});

    // Sample table (few representative altitudes)
    function renderSampleTable(currentAlt){
      const tbody = document.querySelector('#sampleTable tbody');
      const samples = [-30,-12,-6,-2,0,2,5,10,20,30,50,73];
      tbody.innerHTML = '';
      for(const a of samples){
        const rgb = computeColor(a); const hex = toHex(rgb);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="font-family:monospace">${a.toFixed(1)}</td><td>${hex}</td><td>rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})</td><td><div style="width:120px;height:24px;background:${hex};border-radius:4px;border:1px solid rgba(0,0,0,.06)"></div></td>`;
        tbody.appendChild(tr);
      }
    }

    // Gradient preview spanning -30 -> 73
    document.getElementById('showGradient').addEventListener('click', ()=>{
      const container = document.getElementById('gradientContainer');
      const canvas = document.createElement('canvas');
      const width = 1160, height = 80; canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(width,height);
      for(let x=0;x<width;x++){
        const alt = -30 + (73+30)*(x/(width-1));
        const c = computeColor(alt);
        for(let y=0;y<height;y++){
          const idx = (y*width + x)*4;
          img.data[idx] = c[0]; img.data[idx+1] = c[1]; img.data[idx+2] = c[2]; img.data[idx+3] = 255;
        }
      }
      ctx.putImageData(img,0,0);
      container.innerHTML = '';
      container.appendChild(canvas);
    });

    document.getElementById('download').addEventListener('click', ()=>{
      const rows = [];
      rows.push(['altitude_deg','r','g','b','hex'].join(','));
      for(let a=-30; a<=73+1e-9; a = Math.round((a+0.1)*10)/10){
        const rgb = computeColor(a); const hex = toHex(rgb);
        rows.push([a.toFixed(1), rgb[0], rgb[1], rgb[2], hex].join(','));
      }
      const blob = new Blob([rows.join('\n')], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'skycolors_-30_to_73_step0.1.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    // init
    updateUI();

  </script>
</body>
</html>
